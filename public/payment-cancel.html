<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payment Canceled</title>
    <link rel="stylesheet" href="/App.css" />
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background: #f3f4f6;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
      }
      .card {
        background: white;
        padding: 2rem;
        border-radius: 1rem;
        box-shadow: 0 8px 24px rgba(0,0,0,0.15);
        text-align: center;
        max-width: 400px;
      }
      h1 {
        color: #ef4444; /* red for canceled */
        font-size: 2rem;
        margin-bottom: 1rem;
      }
      p {
        color: #374151;
        margin-bottom: 2rem;
      }
      .primary-btn {
        background-color: #ef4444;
        color: white;
        border: none;
        padding: 0.75rem 1.5rem;
        font-size: 1rem;
        border-radius: 0.5rem;
        cursor: pointer;
        transition: background 0.2s;
      }
      .primary-btn:hover {
        background-color: #b91c1c;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Payment Canceled ❌</h1>
      <p>Your payment was not completed. You can try again anytime.</p>
      <a href="/" class="primary-btn">Return Home</a>
    </div>
  </body>
</html>
