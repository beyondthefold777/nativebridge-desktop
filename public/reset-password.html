<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reset Password | NativeBridge</title>

<style>
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background-color: #000;
    color: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }

  .container {
    width: 90%;
    max-width: 420px;
  }

  .card {
    background: #111;
    border: 1px solid #222;
    border-radius: 18px;
    padding: 30px 25px;
  }

  h1 {
    margin: 0 0 10px 0;
    font-size: 26px;
    font-weight: 700;
    text-align: center;
  }

  p {
    font-size: 14px;
    color: #aaa;
    text-align: center;
    margin-bottom: 25px;
  }

  input {
    width: 100%;
    padding: 14px;
    margin-bottom: 14px;
    border-radius: 12px;
    border: 1px solid #333;
    background-color: #000;
    color: #fff;
    font-size: 15px;
    outline: none;
  }

  input:focus {
    border-color: #0077FF;
  }

  button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    background: linear-gradient(90deg, #00BFFF, #0077FF);
    color: #fff;
    transition: 0.2s ease;
  }

  button:hover {
    opacity: 0.9;
  }

  .success {
    color: #00FFAA;
    text-align: center;
    margin-top: 15px;
  }

  .error {
    color: #FF4444;
    text-align: center;
    margin-top: 15px;
  }

  .logo {
    text-align: center;
    margin-bottom: 25px;
    font-size: 18px;
    font-weight: 700;
    background: linear-gradient(90deg, #00BFFF, #0077FF);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
</style>
</head>

<body>
  <div class="container">
    <div class="card">
      <div class="logo">NativeBridge</div>

      <h1>Reset Password</h1>
      <p>Enter your new password below</p>

      <input type="password" id="password" placeholder="New Password" />
      <input type="password" id="confirm" placeholder="Confirm Password" />

      <button onclick="handleReset()">Update Password</button>

      <div id="message"></div>
    </div>
  </div>

<script>
  const API_BASE = "https://nativebridgeproject.fly.dev";

  function getToken() {
    const params = new URLSearchParams(window.location.search);
    return params.get("token");
  }

  async function handleReset() {
    const password = document.getElementById("password").value;
    const confirm = document.getElementById("confirm").value;
    const messageDiv = document.getElementById("message");

    messageDiv.innerHTML = "";

    if (!password || !confirm) {
      messageDiv.innerHTML = "<div class='error'>Please fill all fields</div>";
      return;
    }

    if (password !== confirm) {
      messageDiv.innerHTML = "<div class='error'>Passwords do not match</div>";
      return;
    }

    const token = getToken();

    if (!token) {
      messageDiv.innerHTML = "<div class='error'>Invalid reset link</div>";
      return;
    }

    try {
      const res = await fetch(`${API_BASE}/api/auth/reset-password`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ token, password })
      });

      const data = await res.json();

      if (!res.ok) {
        throw new Error(data.message || "Reset failed");
      }

      messageDiv.innerHTML =
        "<div class='success'>Password updated successfully. You can now return to the app and login.</div>";

    } catch (err) {
      messageDiv.innerHTML =
        "<div class='error'>" + err.message + "</div>";
    }
  }
</script>
</body>
</html>
